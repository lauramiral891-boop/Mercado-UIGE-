<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246BFD" />
      <stop offset="60%" stop-color="#0B2A5B" />
      <stop offset="100%" stop-color="#07111F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#B7F34A" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shopping Cart Icon in Tech Green #B7F34A -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <path d="M96 96h48l40 180c4 16 18 28 36 28h172c18 0 32-12 36-28l36-140H144" fill="none" stroke="#B7F34A" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="224" cy="368" r="28" fill="#B7F34A" />
    <circle cx="384" cy="368" r="28" fill="#B7F34A" />
  </g>

  <!-- Glowing Star Badge -->
  <polygon points="380,110 400,150 445,155 410,185 420,230 380,205 340,230 350,185 315,155 360,150" fill="#B7F34A" />
</svg>
